services:
  server:
    build:
      context: ./server
    container_name: bdms-server
    restart: unless-stopped
    volumes:
      # Ensures MONGO_URI and secrets load reliably (env_file alone can fail on Windows / CRLF).
      - ./server/.env:/app/.env:ro
    environment:
      PORT: 5050
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5050
    ports:
      - "5050:5050"

  client:
    build:
      context: ./client
    container_name: bdms-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Bind-mount repo; node_modules uses a Docker volume filled from `npm ci` at image build time.
      # If new packages are missing inside the container, rebuild—e.g.
      #   docker compose build --no-cache client && docker compose up -d client
      - ./client:/app
      - bdms-client-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  bdms-client-node-modules:
